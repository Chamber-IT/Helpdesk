<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Chamber IT Helpdesk System</title>
  <style>
    :root{
      --bg:#f5f0ef;
      --surface:#ffffff;
      --surface-2:#fbf7f6;
      --tx:#1d1212;
      --mu:#685555;
      --bd:#e2d3d1;
      --bd-strong:#cbb3b0;
      --crimson:#6b1919;
      --crimson-2:#8c2424;
      --crimson-deep:#470f0f;
      --crimson-soft:rgba(107,25,25,.09);
      --gold:#c89d3c;
      --gold-soft:rgba(200,157,60,.16);
      --ok:#15803d;
      --ok-bg:#dcfce7;
      --wa:#a16207;
      --wa-bg:#fef3c7;
      --er:#b91c1c;
      --er-bg:#fee2e2;
      --radius-lg:18px;
      --radius-md:13px;
      --radius-sm:10px;
      --shadow:0 12px 32px rgba(54,14,14,.08);
      --shadow-sm:0 3px 12px rgba(54,14,14,.05);
      color-scheme:light;
    }
    @media(prefers-color-scheme:dark){
      :root{
        --bg:#120b0b;
        --surface:#1d1313;
        --surface-2:#261919;
        --tx:#f7eeee;
        --mu:#b9a2a2;
        --bd:#372424;
        --bd-strong:#4d3333;
        --crimson:#df6b6b;
        --crimson-2:#ef8282;
        --crimson-deep:#2d1111;
        --crimson-soft:rgba(223,107,107,.14);
        --gold:#dfb656;
        --gold-soft:rgba(223,182,86,.14);
        --ok:#86efac;
        --ok-bg:#12311d;
        --wa:#fcd34d;
        --wa-bg:#382a0b;
        --er:#fca5a5;
        --er-bg:#421717;
        --shadow:0 14px 36px rgba(0,0,0,.45);
        --shadow-sm:0 4px 14px rgba(0,0,0,.3);
        color-scheme:dark;
      }
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      font:15px/1.55 "Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
      background:
        radial-gradient(circle at 10% 0%, var(--crimson-soft), transparent 38%),
        radial-gradient(circle at 92% 12%, var(--gold-soft), transparent 36%),
        var(--bg);
      color:var(--tx);
      min-height:100vh;
      touch-action:manipulation;
      -webkit-font-smoothing:antialiased;
    }
    .hide{display:none!important}
    .mu{color:var(--mu)}
    h1,h2,h3{margin:0;letter-spacing:-.02em}
    h2{font-size:20px;font-weight:700}
    h3{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--mu);margin:22px 0 10px}

    /* Generous, tactile form controls */
    input,select,textarea,.btn{
      font:inherit;
      color:inherit;
      border:1px solid var(--bd);
      background:var(--surface);
      border-radius:var(--radius-sm);
      padding:11px 14px;
      min-height:44px;
      pointer-events:auto;
      user-select:auto;
      -webkit-user-select:auto;
      touch-action:manipulation;
      transition:border-color .16s,box-shadow .16s,background .16s,transform .12s;
    }
    input:hover,select:hover,textarea:hover{border-color:var(--bd-strong)}
    input:focus,select:focus,textarea:focus{
      outline:none;
      border-color:var(--crimson);
      box-shadow:0 0 0 3px var(--crimson-soft);
    }
    textarea{width:100%;min-height:112px;resize:vertical}
    input,select{min-width:0}

    .btn{
      cursor:pointer;
      font-weight:650;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      padding:10px 18px;
      min-height:44px;
      white-space:nowrap;
      box-shadow:var(--shadow-sm);
    }
    .btn:hover{border-color:var(--crimson);background:var(--crimson-soft)}
    .btn.p{
      background:linear-gradient(135deg,#781c1c 0%,#4e1010 100%);
      border-color:#4e1010;
      color:#fff;
    }
    .btn.p:hover{
      background:linear-gradient(135deg,#8d2323 0%,#5e1414 100%);
      border-color:#5e1414;
    }
    .btn.sm{padding:8px 14px;min-height:38px;font-size:13px}
    .btn:disabled{opacity:.55;cursor:wait}
    :focus-visible{outline:2px solid var(--crimson);outline-offset:2px}

    /* Login Experience */
    .login{
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:22px;
      position:relative;
      z-index:1;
    }
    .lc{
      width:100%;
      max-width:440px;
      display:grid;
      gap:16px;
      padding:32px 28px;
      background:var(--surface);
      border:1px solid var(--bd);
      border-top:5px solid #6b1919;
      border-radius:var(--radius-lg);
      box-shadow:var(--shadow);
      position:relative;
      z-index:2;
    }
    .brand-hero{
      display:flex;
      align-items:center;
      gap:14px;
      padding-bottom:14px;
      border-bottom:1px solid var(--bd);
    }
    .brand-hero img{
      height:52px;
      width:auto;
      max-width:74px;
      object-fit:contain;
      background:#fff;
      padding:5px;
      border-radius:10px;
      border:1px solid var(--bd);
    }
    .eyebrow{
      display:inline-flex;
      align-items:center;
      gap:6px;
      font-size:11px;
      font-weight:700;
      text-transform:uppercase;
      letter-spacing:.08em;
      color:var(--crimson);
      background:var(--crimson-soft);
      padding:3px 9px;
      border-radius:999px;
      margin-bottom:5px;
    }
    .lc h1{font-size:22px;font-weight:800}
    .lc input{width:100%;padding:12px 14px;font-size:15px}

    /* Tech-Forward Chamber Topbar */
    .top{
      position:sticky;
      top:0;
      z-index:8;
      display:flex;
      gap:14px;
      align-items:center;
      min-height:68px;
      padding:10px 24px;
      background:linear-gradient(125deg,#5e1414 0%,#3d0c0c 100%);
      color:#fff;
      border-bottom:3px solid var(--gold);
      box-shadow:0 6px 24px rgba(36,7,7,.26);
    }
    .top-brand{display:flex;align-items:center;gap:12px}
    .top-brand img{
      height:40px;
      width:auto;
      max-width:56px;
      object-fit:contain;
      background:#fff;
      padding:4px;
      border-radius:9px;
    }
    .top-brand .titles{display:flex;flex-direction:column;gap:1px}
    .top-brand b{font-size:16px;font-weight:750;letter-spacing:-.015em;line-height:1.2}
    .top-brand small{font-size:11.5px;color:rgba(255,255,255,.78);line-height:1.2}

    .top nav{display:flex;gap:8px;margin-left:18px}
    .top nav button{
      border:1px solid rgba(255,255,255,.14);
      background:rgba(255,255,255,.08);
      color:rgba(255,255,255,.88);
      font:inherit;
      font-size:14px;
      font-weight:650;
      padding:9px 18px;
      min-height:42px;
      border-radius:10px;
      cursor:pointer;
      transition:all .15s;
    }
    .top nav button:hover{background:rgba(255,255,255,.18);color:#fff}
    .top nav button.on{
      background:#fff;
      color:#4c1010;
      border-color:#fff;
      box-shadow:0 2px 10px rgba(0,0,0,.18);
    }
    .top .btn{
      background:rgba(255,255,255,.1);
      border-color:rgba(255,255,255,.26);
      color:#fff;
      box-shadow:none;
    }
    .top .btn:hover{background:rgba(255,255,255,.2);border-color:#fff}
    .top .btn.p{
      background:var(--gold);
      border-color:var(--gold);
      color:#240e0e;
      font-weight:750;
    }
    .top .btn.p:hover{background:#e6be5f;border-color:#e6be5f}
    .sp{flex:1}

    /* Main Container & Filter Bar */
    main{max-width:1120px;margin:0 auto;padding:24px 22px}
    .bar{
      display:grid;
      grid-template-columns:minmax(220px,1.6fr) repeat(3,minmax(150px,1fr));
      gap:10px;
      margin-bottom:18px;
      background:var(--surface);
      padding:12px;
      border-radius:var(--radius-md);
      border:1px solid var(--bd);
      box-shadow:var(--shadow-sm);
    }

    /* Ticket Cards */
    .row{
      background:var(--surface);
      border:1px solid var(--bd);
      border-left:4px solid var(--crimson);
      border-radius:var(--radius-md);
      padding:16px 18px;
      margin-bottom:12px;
      cursor:pointer;
      box-shadow:var(--shadow-sm);
      transition:transform .14s,border-color .16s,box-shadow .16s;
    }
    .row:hover{
      border-color:var(--crimson);
      border-left-width:6px;
      transform:translateY(-2px);
      box-shadow:var(--shadow);
    }
    .r1{display:flex;gap:12px;align-items:baseline}
    .r1 b{font-weight:700;font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .id{
      font-size:12px;
      font-weight:750;
      color:var(--crimson);
      background:var(--crimson-soft);
      padding:2px 8px;
      border-radius:6px;
      font-variant-numeric:tabular-nums;
      white-space:nowrap;
    }
    .r2{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:9px;font-size:12.5px}

    .chip{
      display:inline-flex;
      align-items:center;
      padding:3px 11px;
      border-radius:999px;
      font-size:12px;
      font-weight:650;
      background:var(--surface-2);
      border:1px solid var(--bd);
    }
    .s-New,.s-Assigned{background:var(--crimson-soft);color:var(--crimson);border-color:transparent}
    .s-InProgress{background:var(--wa-bg);color:var(--wa);border-color:transparent}
    .s-WaitingonUser{background:var(--er-bg);color:var(--er);border-color:transparent}
    .s-Resolved,.s-Closed{background:var(--ok-bg);color:var(--ok);border-color:transparent}
    .p-Critical,.over{background:var(--er-bg);color:var(--er);border-color:transparent}
    .p-High{background:var(--wa-bg);color:var(--wa);border-color:transparent}

    .empty{
      text-align:center;
      padding:56px 18px;
      color:var(--mu);
      background:var(--surface);
      border:1px dashed var(--bd-strong);
      border-radius:var(--radius-lg);
    }

    /* Dashboard */
    .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:20px}
    .kpi{
      background:var(--surface);
      border:1px solid var(--bd);
      border-top:4px solid var(--crimson);
      border-radius:var(--radius-md);
      padding:16px 18px;
      box-shadow:var(--shadow-sm);
    }
    .kpi b{display:block;font-size:30px;font-weight:800;line-height:1.15;margin-top:6px;font-variant-numeric:tabular-nums;color:var(--crimson)}
    .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:16px}
    .panel{background:var(--surface);border:1px solid var(--bd);border-radius:var(--radius-md);padding:18px;box-shadow:var(--shadow-sm)}
    .panel h3{margin-top:0}
    .br{display:grid;grid-template-columns:135px 1fr 34px;gap:10px;align-items:center;margin:9px 0;font-size:13.5px}
    .br i{display:block;height:10px;border-radius:999px;background:linear-gradient(90deg,#781c1c,var(--gold))}

    /* Detail Drawer */
    .drawer{
      position:fixed;
      top:0;
      right:0;
      height:100%;
      width:min(620px,100%);
      background:var(--bg);
      border-left:1px solid var(--bd);
      box-shadow:-12px 0 36px rgba(0,0,0,.2);
      overflow:auto;
      transform:translateX(106%);
      transition:transform .22s ease;
      z-index:15;
    }
    .drawer.open{transform:none}
    .pad{padding:24px}
    .dh{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
    .desc{white-space:pre-wrap;background:var(--surface);border:1px solid var(--bd);border-radius:var(--radius-md);padding:15px;margin:14px 0;box-shadow:var(--shadow-sm)}
    .ctl{display:grid;grid-template-columns:1fr 1fr;gap:12px;background:var(--surface);padding:14px;border-radius:var(--radius-md);border:1px solid var(--bd)}
    .ctl label{font-size:12px;font-weight:700;color:var(--mu);display:block;margin-bottom:5px}
    .ctl select{width:100%}
    .cm{background:var(--surface);border:1px solid var(--bd);border-radius:var(--radius-md);padding:12px 15px;margin-bottom:10px;white-space:pre-wrap;box-shadow:var(--shadow-sm)}
    .cm.in{background:var(--wa-bg);border-color:rgba(161,98,7,.25)}
    .cm small{display:block;color:var(--mu);margin-bottom:4px;font-weight:650}
    .ra{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap}
    .stars button{border:0;background:none;font-size:28px;cursor:pointer;color:var(--gold);padding:2px 5px}

    /* New Ticket Modal */
    .modal{position:fixed;inset:0;background:rgba(18,7,7,.62);backdrop-filter:blur(3px);display:grid;place-items:center;padding:16px;z-index:25}
    .mb{
      width:100%;
      max-width:580px;
      background:var(--surface);
      border:1px solid var(--bd);
      border-top:5px solid #6b1919;
      border-radius:var(--radius-lg);
      padding:24px;
      display:grid;
      gap:13px;
      max-height:94vh;
      overflow:auto;
      box-shadow:var(--shadow);
    }
    .mb input,.mb select{width:100%}
    .mb label{font-size:12.5px;font-weight:700;color:var(--mu);display:grid;gap:5px}
    .two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .req-box{
      background:var(--surface-2);
      border:1px solid var(--bd);
      border-left:3px solid var(--gold);
      border-radius:var(--radius-sm);
      padding:12px;
      display:grid;
      gap:10px;
    }

    /* Toast */
    #toast{
      position:fixed;
      bottom:22px;
      left:50%;
      transform:translate(-50%,100px);
      background:#2b0d0d;
      color:#fff;
      border:1px solid var(--gold);
      padding:11px 20px;
      border-radius:999px;
      font-weight:650;
      box-shadow:var(--shadow);
      transition:transform .2s;
      z-index:40;
      pointer-events:none;
    }
    #toast.show{transform:translate(-50%,0)}
    #toast.err{background:var(--er);border-color:#fff;color:#fff}

    .footer-note{text-align:center;font-size:12px;color:var(--mu);margin-top:28px;padding-bottom:14px}

    @media(max-width:820px){
      .bar{grid-template-columns:1fr 1fr}
    }
    @media(max-width:640px){
      .top{padding:10px 14px;gap:8px}
      .top nav{margin-left:2px;gap:6px}
      .top nav button{padding:8px 12px;font-size:13px}
      .top-brand .titles{display:none}
      main{padding:16px 14px}
      .bar{grid-template-columns:1fr}
      .two-col,.ctl{grid-template-columns:1fr}
    }
    @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>
  <div id="login" class="login hide">
    <div class="lc">
      <div class="brand-hero">
        <img src="https://www.chamber.lk/wp-content/uploads/2024/09/ccc-logo-lg.jpg" alt="The Ceylon Chamber of Commerce">
        <div>
          <div class="eyebrow">The Ceylon Chamber of Commerce</div>
          <h1>Chamber IT Helpdesk System</h1>
        </div>
      </div>
      <p class="mu" style="margin:0">Sign in with your Chamber email address. We’ll send you a 6-digit verification code.</p>
      <div id="l1" style="display:grid;gap:12px">
        <input id="em" type="email" inputmode="email" placeholder="you@chamber.lk" autocomplete="email" autocapitalize="off" autocorrect="off" spellcheck="false">
        <button class="btn p" id="send" type="button">Send verification code</button>
      </div>
      <div id="l2" class="hide" style="display:grid;gap:12px">
        <input id="cd" type="text" inputmode="numeric" maxlength="6" placeholder="Enter 6-digit code" autocomplete="one-time-code">
        <button class="btn p" id="go" type="button">Sign in to Helpdesk</button>
        <a href="#" id="back" class="mu" style="font-size:13px">Use a different email</a>
      </div>
    </div>
  </div>

  <div id="app" class="hide">
    <header class="top">
      <div class="top-brand">
        <img src="https://www.chamber.lk/wp-content/uploads/2024/09/ccc-logo-lg.jpg" alt="The Ceylon Chamber of Commerce">
        <div class="titles">
          <b>Chamber IT Helpdesk System</b>
          <small>The Ceylon Chamber of Commerce</small>
        </div>
      </div>
      <nav>
        <button data-v="tickets" class="on" type="button">Tickets</button>
        <button data-v="dash" id="navd" type="button">Dashboard</button>
      </nav>
      <span class="sp"></span>
      <button class="btn p" id="nt" type="button">+ New ticket</button>
      <button class="btn" id="out" type="button">Sign out</button>
    </header>

    <main>
      <section id="v-tickets">
        <div class="bar">
          <input id="q" type="search" placeholder="Search ticket ID, subject, requester…">
          <select id="fs"></select>
          <select id="fp"></select>
          <select id="fa" class="hide"></select>
        </div>
        <div id="rows"></div>
      </section>
      <section id="v-dash" class="hide"></section>
      <div class="footer-note">Chamber IT Helpdesk System • The Ceylon Chamber of Commerce</div>
    </main>
  </div>

  <aside id="dr" class="drawer"></aside>
  <div id="md" class="modal hide"></div>
  <div id="toast"></div>

  <script>
    const API = 'https://script.google.com/macros/s/AKfycbx_vV_wa2ymwDRaZgt8uwcyMuXKZODYdQeWbqmh8sYjgqKowje3_Z3rwFP-J8zMDeTX3w/exec';
    const ST = ['New','Assigned','In Progress','Waiting on User','Resolved','Closed'], OPEN = ST.slice(0,4), PR = ['Low','Medium','High','Critical'];
    const $ = s => document.querySelector(s);
    const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    const S = {token:localStorage.tok||'',user:null,tickets:[],cats:[],slas:[],it:[],users:[],view:'tickets',f:{q:'',st:'open',pr:'',as:''},cur:null,cm:[]};
    const isIT = () => S.user && S.user.Role !== 'Staff';
    const over = t => OPEN.includes(t.Status) && t.DueResolve && new Date(t.DueResolve) < Date.now();
    const ago = d => {const m = (Date.now() - new Date(d)) / 6e4; return m < 1 ? 'just now' : m < 60 ? ~~m + 'm ago' : m < 1440 ? ~~(m/60) + 'h ago' : ~~(m/1440) + 'd ago';};
    const chip = (l,c) => `<span class="chip ${c || 's-' + String(l).replace(/ /g,'')}">${esc(l)}</span>`;
    const opt = (v,cur,l) => `<option value="${esc(v)}" ${v===cur ? 'selected' : ''}>${esc(l ?? v)}</option>`;

    function toast(m,e){
      const t = $('#toast');
      t.textContent = m;
      t.className = 'show' + (e ? ' err' : '');
      clearTimeout(toast.t);
      toast.t = setTimeout(() => { t.className = ''; }, 3200);
    }

    async function api(a,p={}){
      let j;
      try {
        const r = await fetch(API, {method:'POST', headers:{'Content-Type':'text/plain'}, body:JSON.stringify({a, token:S.token, ...p})});
        j = await r.json();
      } catch(e) {
        throw new Error('Can’t reach the server. Check your connection.');
      }
      if (!j.ok) {
        if (/session expired/i.test(j.error)) logout(true);
        throw new Error(j.error);
      }
      return j.data;
    }

    const cache = () => {
      localStorage.cache = JSON.stringify({
        user:S.user, tickets:S.tickets, cats:S.cats, slas:S.slas, it:S.it, users:S.users
      });
    };

    function ensureInputReady(el){
      if (!el) return;
      el.disabled = false;
      el.readOnly = false;
      el.style.pointerEvents = 'auto';
      el.style.userSelect = 'auto';
      el.style.webkitUserSelect = 'auto';
    }

    function logout(exp){
      localStorage.removeItem('tok');
      localStorage.removeItem('cache');
      S.token = '';
      S.user = null;
      S.users = [];
      closeD();
      $('#app').classList.add('hide');
      $('#login').classList.remove('hide');
      $('#l1').classList.remove('hide');
      $('#l2').classList.add('hide');
      ensureInputReady($('#em'));
      ensureInputReady($('#cd'));
      if (exp === true) toast('Session expired. Sign in again.', 1);
    }

    /* login */
    ['click','pointerdown','touchstart'].forEach(ev => {
      $('#em').addEventListener(ev, () => {
        ensureInputReady($('#em'));
        if (document.activeElement !== $('#em')) $('#em').focus({preventScroll:true});
      }, {passive:true});
    });

    $('#send').onclick = async e => {
      const b = e.currentTarget;
      b.disabled = true;
      try {
        await api('otp', {email:$('#em').value});
        $('#l1').classList.add('hide');
        $('#l2').classList.remove('hide');
        ensureInputReady($('#cd'));
        $('#cd').focus();
        toast('Code sent. Check your email.');
      } catch(x) {
        toast(x.message, 1);
      }
      b.disabled = false;
    };

    $('#go').onclick = async e => {
      const b = e.currentTarget;
      b.disabled = true;
      try {
        const d = await api('login', {email:$('#em').value, code:$('#cd').value});
        S.token = localStorage.tok = d.token;
        $('#cd').value = '';
        await boot();
      } catch(x) {
        toast(x.message, 1);
      }
      b.disabled = false;
    };

    $('#back').onclick = e => {
      e.preventDefault();
      $('#l2').classList.add('hide');
      $('#l1').classList.remove('hide');
      ensureInputReady($('#em'));
      $('#em').focus();
    };

    $('#em').onkeydown = e => { if (e.key === 'Enter') $('#send').click(); };
    $('#cd').onkeydown = e => { if (e.key === 'Enter') $('#go').click(); };
    $('#out').onclick = () => logout();

    /* boot: paint cached data instantly, refresh in background */
    async function boot(){
      if (!S.token) return logout();
      const c = localStorage.cache;
      if (c) { Object.assign(S, JSON.parse(c)); show(); }
      try {
        Object.assign(S, await api('init'));
        cache();
        show();
      } catch(e) {
        if (S.token && !c) logout();
        if (S.token) toast(e.message, 1);
      }
    }

    function show(){
      $('#login').classList.add('hide');
      $('#app').classList.remove('hide');
      $('#navd').classList.toggle('hide', !isIT());
      $('#fa').classList.toggle('hide', !isIT());
      const f = S.f;
      $('#fs').innerHTML = opt('open', f.st, 'Open tickets') + opt('all', f.st, 'All tickets') + ST.map(s => opt(s, f.st)).join('');
      $('#fp').innerHTML = opt('', f.pr, 'Any priority') + PR.map(p => opt(p, f.pr)).join('');
      $('#fa').innerHTML = opt('', f.as, 'Anyone') + opt('_', f.as, 'Unassigned') + S.it.map(n => opt(n, f.as)).join('');
      view(S.view);
    }

    function view(v){
      S.view = v;
      document.querySelectorAll('.top nav button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
      $('#v-tickets').classList.toggle('hide', v !== 'tickets');
      $('#v-dash').classList.toggle('hide', v !== 'dash');
      v === 'dash' ? dash() : list();
    }
    document.querySelectorAll('.top nav button').forEach(b => { b.onclick = () => view(b.dataset.v); });

    /* list */
    function filt(){
      const f = S.f, q = f.q.toLowerCase();
      return S.tickets.filter(t =>
        (f.st === 'open' ? OPEN.includes(t.Status) : f.st === 'all' || t.Status === f.st) &&
        (!f.pr || t.Priority === f.pr) &&
        (!f.as || (f.as === '_' ? !t.AssignedTo : t.AssignedTo === f.as)) &&
        (!q || (t.TicketID + t.Subject + t.Name + t.Email + t.Description).toLowerCase().includes(q))
      );
    }

    function list(){
      const r = filt();
      $('#rows').innerHTML = r.length
        ? r.map(t => `<div class="row" data-id="${t.TicketID}" tabindex="0"><div class="r1"><span class="id">${t.TicketID}</span><b>${esc(t.Subject)}</b></div><div class="r2">${chip(t.Status)}${chip(t.Priority,'p-'+t.Priority)}${over(t)?'<span class="chip over">Overdue</span>':''}<span class="mu">${isIT()?esc(t.Name)+(t.Dept?' ('+esc(t.Dept)+')':'')+' • ':''}${t.AssignedTo?'Assigned to '+esc(t.AssignedTo)+' • ':''}${ago(t.Created)}</span></div></div>`).join('')
        : `<div class="empty">${S.tickets.length ? 'No tickets match these filters.' : 'No tickets yet. Click “+ New ticket” to submit a request.'}</div>`;
    }

    $('#rows').onclick = e => { const r = e.target.closest('.row'); if (r) openT(r.dataset.id); };
    $('#rows').onkeydown = e => { if (e.key === 'Enter') { const r = e.target.closest('.row'); if (r) openT(r.dataset.id); } };
    $('#q').oninput = e => { S.f.q = e.target.value; list(); };
    [['fs','st'],['fp','pr'],['fa','as']].forEach(([i,k]) => { $('#'+i).onchange = e => { S.f[k] = e.target.value; list(); }; });

    /* dashboard (IT) */
    function dash(){
      const T = S.tickets, op = T.filter(t => OPEN.includes(t.Status)), mo = new Date();
      mo.setDate(1); mo.setHours(0,0,0,0);
      const rs = T.filter(t => t.ResolvedAt && new Date(t.ResolvedAt) >= mo), rt = T.filter(t => t.Rating);
      const avg = (a,f) => a.length ? a.reduce((s,t) => s + f(t), 0) / a.length : 0;
      const hrs = avg(rs, t => (new Date(t.ResolvedAt) - new Date(t.Created)) / 36e5);
      const by = (a,k) => { const m = {}; a.forEach(t => { m[t[k]||'—'] = (m[t[k]||'—']||0) + 1; }); return Object.entries(m).sort((x,y) => y[1] - x[1]); };
      const bars = a => { const mx = Math.max(1, ...a.map(x => x[1])); return a.map(([n,c]) => `<div class="br"><span>${esc(n)}</span><i style="width:${c/mx*100}%"></i><b>${c}</b></div>`).join('') || '<p class="mu">No data</p>'; };
      $('#v-dash').innerHTML = `<div class="kpis"><div class="kpi"><span class="mu">Open</span><b>${op.length}</b></div><div class="kpi"><span class="mu">Unassigned</span><b>${op.filter(t=>!t.AssignedTo).length}</b></div><div class="kpi"><span class="mu">Overdue</span><b>${op.filter(over).length}</b></div><div class="kpi"><span class="mu">Resolved this month</span><b>${rs.length}</b></div><div class="kpi"><span class="mu">Avg. resolution (h)</span><b>${hrs?hrs.toFixed(1):'–'}</b></div><div class="kpi"><span class="mu">Satisfaction (of 5)</span><b>${rt.length?avg(rt,t=>+t.Rating).toFixed(1):'–'}</b></div></div>
      <div class="cols"><div class="panel"><h3>Open by category</h3>${bars(by(op,'Category'))}</div><div class="panel"><h3>Open by assignee</h3>${bars(by(op.map(t=>({AssignedTo:t.AssignedTo||'Unassigned'})),'AssignedTo'))}</div><div class="panel"><h3>All tickets by status</h3>${bars(by(T,'Status'))}</div><div class="panel"><h3>Tickets by department</h3>${bars(by(T,'Dept'))}</div></div>`;
    }

    /* detail drawer */
    function closeD(){ $('#dr').classList.remove('open'); S.cur = null; }
    async function openT(id){
      const d = $('#dr'); d.classList.add('open'); d.innerHTML = '<div class="pad mu">Loading…</div>';
      const t = S.tickets.find(x => x.TicketID === id); if (t) { S.cur = t; S.cm = []; draw(); }
      try { const r = await api('get', {id}); S.cur = r.t; S.cm = r.c; draw(); }
      catch(e) { toast(e.message, 1); closeD(); }
    }

    function draw(){
      const t = S.cur, it = isIT();
      const sel = (f,v,a) => `<div><label>${f}</label><select data-f="${f==='Assign to'?'AssignedTo':f}">${a}</select></div>`;
      const done = ['Resolved','Closed'].includes(t.Status);
      $('#dr').innerHTML = `<div class="pad"><div class="dh"><div><span class="id">${t.TicketID}</span><h2 style="margin-top:6px">${esc(t.Subject)}</h2></div><button class="btn sm" id="x" type="button">Close</button></div>
      <div class="r2" style="margin:10px 0">${chip(t.Status)}${chip(t.Priority,'p-'+t.Priority)}${over(t)?'<span class="chip over">Overdue</span>':''}</div>
      <p class="mu" style="margin:0">${esc(t.Name)} (${esc(t.Email)})${t.Dept?' • '+esc(t.Dept):''}<br>${esc(t.Category)}${t.Asset?' • Asset: '+esc(t.Asset):''}<br>Opened ${ago(t.Created)} • Target resolution ${new Date(t.DueResolve).toLocaleString()}</p>
      <div class="desc">${esc(t.Description)}</div>
      ${it ? `<div class="ctl">${sel('Status',0,ST.map(s=>opt(s,t.Status)).join(''))}${sel('Priority',0,PR.map(s=>opt(s,t.Priority)).join(''))}${sel('Assign to',0,opt('',t.AssignedTo,'Unassigned')+S.it.map(n=>opt(n,t.AssignedTo)).join(''))}${sel('Category',0,S.cats.map(s=>opt(s,t.Category)).join(''))}</div>` :
        done ? `<div class="ra" style="justify-content:flex-start;gap:8px">${t.Status==='Resolved'?'<button class="btn p sm" data-u="Closed" type="button">Confirm it’s fixed</button>':''}<button class="btn sm" data-u="In Progress" type="button">Reopen</button></div>${t.Rating?`<p class="mu">You rated this ${t.Rating}/5.</p>`:`<p class="mu" style="margin:10px 0 0">How was the support?</p><div class="stars">${[1,2,3,4,5].map(n=>`<button data-r="${n}" aria-label="${n} stars" type="button">★</button>`).join('')}</div>`}` : ''}
      <h3>Conversation</h3>${S.cm.map(c=>`<div class="cm ${c.Type==='Internal'?'in':''}"><small>${esc(c.Author)}${c.Type==='Internal'?' (internal note)':''} • ${ago(c.Time)}</small>${esc(c.Text)}</div>`).join('')||'<p class="mu">No replies yet.</p>'}
      <textarea id="rt" placeholder="Write a reply…"></textarea><div class="ra">${it?'<label style="display:flex;align-items:center;gap:6px;font-size:13px"><input type="checkbox" id="in"> Internal note (staff can’t see it)</label>':'<span></span>'}<button class="btn p" id="sr" type="button">Send reply</button></div></div>`;
    }

    $('#dr').onclick = async e => {
      const t = S.cur, b = e.target; if (!t) return;
      if (b.id === 'x') return closeD();
      if (b.id === 'sr') {
        const text = $('#rt').value.trim(); if (!text) return toast('Write a reply first', 1); b.disabled = true;
        try {
          const r = await api('comment', {id:t.TicketID, text, internal:!!($('#in') && $('#in').checked)});
          S.cm.push({Author:S.user.Name, Type:$('#in')&&$('#in').checked?'Internal':'Public', Text:text, Time:new Date().toISOString()});
          merge(r.t); toast('Reply sent');
        } catch(x) { toast(x.message, 1); b.disabled = false; }
        return;
      }
      if (b.dataset.u) return upd({Status:b.dataset.u});
      if (b.dataset.r) {
        try { merge(await api('rate', {id:t.TicketID, rating:b.dataset.r})); toast('Thanks for the feedback'); }
        catch(x) { toast(x.message, 1); }
      }
    };

    $('#dr').onchange = e => { const f = e.target.dataset.f; if (f) upd({[f]:e.target.value}); };

    async function upd(patch){
      try { merge(await api('update', {id:S.cur.TicketID, patch})); toast('Saved'); }
      catch(x) { toast(x.message, 1); draw(); }
    }

    function merge(t){
      const i = S.tickets.findIndex(x => x.TicketID === t.TicketID);
      if (i < 0) S.tickets.unshift(t); else S.tickets[i] = t;
      if (S.cur && S.cur.TicketID === t.TicketID) S.cur = t;
      cache();
      S.view === 'dash' ? dash() : list();
      if (S.cur) draw();
    }

    /* Build requester options from Users sheet + fallback from existing tickets */
    function getRequesterList(){
      const map = new Map();
      (S.users || []).forEach(u => {
        const em = String(u.Email || '').trim().toLowerCase();
        if (!em) return;
        map.set(em, {
          Email: em,
          Name: String(u.Name || em.split('@')[0]).trim(),
          Dept: String(u.Dept || '').trim()
        });
      });
      if (!map.size) {
        (S.tickets || []).forEach(t => {
          const em = String(t.Email || '').trim().toLowerCase();
          if (em && !map.has(em)) {
            map.set(em, {
              Email: em,
              Name: String(t.Name || em.split('@')[0]).trim(),
              Dept: String(t.Dept || '').trim()
            });
          }
        });
      }
      return Array.from(map.values()).sort((a, b) => a.Name.localeCompare(b.Name));
    }

    function renderRequesterOptions(selectedEmail = ''){
      const sel = $('#nrs');
      if (!sel) return;
      const list = getRequesterList();
      const opts = list
        .map(u => `<option value="${esc(u.Email)}" ${u.Email === selectedEmail ? 'selected' : ''}>${esc(u.Name)}${u.Dept ? ' • ' + esc(u.Dept) : ''} (${esc(u.Email)})</option>`)
        .join('');
      sel.innerHTML = `<option value="">Myself (${esc(S.user ? S.user.Name : 'Current User')})</option>${opts}<option value="__custom__">+ Enter another user manually…</option>`;
    }

    /* new ticket */
    $('#nt').onclick = async () => {
      const m = $('#md'); m.classList.remove('hide');
      const reqBlock = isIT()
        ? `<div class="req-box">
            <label>Create ticket on behalf of
              <select id="nrs"></select>
            </label>
            <div id="custom-req" class="two-col hide">
              <label>Requester full name<input id="nrn" type="text" placeholder="e.g. Kasun Perera" autocomplete="off"></label>
              <label>Requester email<input id="nr" type="email" placeholder="kasun@chamber.lk" autocomplete="off"></label>
            </div>
          </div>`
        : '';

      m.innerHTML = `<div class="mb"><h2>Create New Ticket</h2>
      ${reqBlock}
      <label>Subject<input id="ns" maxlength="150" placeholder="e.g. Cannot print from Finance printer"></label>
      <div class="two-col">
        <label>Category<select id="nc">${S.cats.map(c=>opt(c,'')).join('')}</select></label>
        <label>Urgency<select id="np">${opt('Low','Medium','Low: can wait a few days')}${opt('Medium','Medium','Medium: slowing my work')}${opt('High','Medium','High: cannot do my job')}${opt('Critical','Medium','Critical: affects many people')}</select></label>
      </div>
      <label>What’s happening?<textarea id="nd" placeholder="Describe the issue, steps already tried, or any error message…"></textarea></label>
      <label>Device or asset tag (optional)<input id="na" maxlength="100" placeholder="e.g. CCC-LAP-042"></label>
      <div class="ra"><button class="btn" id="nx" type="button">Cancel</button><button class="btn p" id="ny" type="button">Submit ticket</button></div></div>`;

      if (isIT() && $('#nrs')) {
        renderRequesterOptions('');
        $('#nrs').onchange = e => {
          const isCustom = e.target.value === '__custom__';
          $('#custom-req').classList.toggle('hide', !isCustom);
          if (isCustom && $('#nrn')) $('#nrn').focus();
        };
        $('#nrs').focus();

        /* Refresh latest Users sheet entries in the background */
        api('init').then(d => {
          Object.assign(S, d);
          cache();
          const curVal = $('#nrs') ? $('#nrs').value : '';
          if (curVal !== '__custom__') renderRequesterOptions(curVal);
        }).catch(() => {});
      } else {
        $('#ns').focus();
      }

      $('#nx').onclick = () => { m.classList.add('hide'); };
      $('#ny').onclick = async e => {
        const b = e.currentTarget; b.disabled = true;
        try {
          let requester = '', requesterName = '';
          if (isIT() && $('#nrs')) {
            const selVal = $('#nrs').value;
            if (selVal === '__custom__') {
              requester = $('#nr') ? $('#nr').value.trim() : '';
              requesterName = $('#nrn') ? $('#nrn').value.trim() : '';
            } else if (selVal) {
              requester = selVal;
              const matched = getRequesterList().find(u => u.Email === selVal);
              requesterName = matched ? matched.Name : '';
            }
          }
          const t = await api('create', {
            requester,
            requesterName,
            subject:$('#ns').value,
            category:$('#nc').value,
            priority:$('#np').value,
            description:$('#nd').value,
            asset:$('#na').value
          });
          merge(t); m.classList.add('hide'); toast('Ticket ' + t.TicketID + ' submitted');
        } catch(x) { toast(x.message, 1); b.disabled = false; }
      };
    };

    document.onkeydown = e => {
      if (e.key === 'Escape') { closeD(); $('#md').classList.add('hide'); }
    };

    /* background refresh */
    setInterval(async () => {
      if (document.hidden || !S.token || !S.user) return;
      try { const d = await api('init'); Object.assign(S, d); cache(); S.view === 'dash' ? dash() : list(); }
      catch(e) {}
    }, 60000);

    boot();
  </script>
</body>
</html>
